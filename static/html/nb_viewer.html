<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetBox Viewer</title>
    <link rel="stylesheet" href="/static/css/nb_viewer.css">
</head>
<body>
    <div class="nb-main-card">
        <h2>📜 NetBox Viewer</h2>

        <!-- Форма ввода -->
        <div class="nb-form-group">
<!--            <label for="nb-input" class="nb-label">Ввод:</label>-->
            <textarea
                id="nb-input"
                class="nb-textarea"
                placeholder="Вставьте сюда список подсетей/адресов..."
                rows="6"
            ></textarea>
        </div>

        <!-- Кнопка поиска -->
        <div class="nb-search-container">
            <button id="nb-search-btn" class="nb-btn-search">🔎 Поиск</button>
        </div>
        <div class="nb-search-container">
               <button onclick="downloadResult()" id="nb-save-btn" class="nb-btn-save">💾 </button>
        </div>

        <!-- Панель вывода результатов -->
        <div class="nb-results-panel">
            <div id="nb-results-content">
                <div class="nb-placeholder-text">Результаты поиска появятся здесь...</div>
                <pre id="nb-search-pre" style="display: none;"></pre>
            </div>
        </div>
    </div>

    <script src="/static/js/nb_viewer.js"></script>

<script>
function downloadResult() {
    // 1. Получаем элемент ввода (замените 'nb-input' на id вашего textarea или input!)
    const inputElement = document.getElementById('nb-input') || document.querySelector('textarea');

    // 2. Получаем элемент вывода
    const preElement = document.getElementById('nb-search-pre');

    // Считываем значения (если элемент не найден, берем пустую строку)
    const inputText = inputElement ? inputElement.value.trim() : "";
    const outputText = preElement ? (preElement.innerText || preElement.textContent || "").trim() : "";

    // 3. Проверяем, есть ли хоть какие-то данные для сохранения
    if (!outputText || outputText.startsWith('⛔ П')){
            setTimeout(() => {
            alert("Нет данных для сохранения!");
        }, 30);
        return;
    }

    // 4. Формируем красивый итоговый текст с префиксами
    let fileContent = "";

    if (inputText) {
        fileContent += `---NB Viewer---\nВвод:\n${inputText}\n\n`;
    }

    if (outputText) {
        fileContent += `Вывод:\n${outputText}\n`;
    }

    // 5. Создаем Blob и скачиваем файл
    try {
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;

        // Формируем имя файла с текущей датой и временем
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        a.download = `acl_search_result_${timestamp}.txt`;

        document.body.appendChild(a);
        a.click();

        // Очищаем ссылку из памяти
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);

    } catch (err) {
        console.error("Ошибка при скачивании файла:", err);
    }
}
</script>



</body>
</html>
