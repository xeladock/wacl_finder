<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object-Group Viewer</title>
    <!-- Подключаем базовые стили инпутов и новую тему для этой страницы -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/og_viewer.css">
</head>
<body class="og-page-body">

    <div class="og-main-card">
        <h2>📦 Object-Group Viewer</h2>

        <div class="og-form">
            <!-- Строка: Устройство -->
            <div class="og-field-row">
                <label class="og-label">Устройство:</label>
                <input type="text" id="og-device" class="input-field og-input" placeholder="Имя устройства..." maxlength="50">
                <button onclick="clearOGField('og-device')" class="btn-del">del</button>
            </div>

            <!-- Строка: Object-Group -->
            <div class="og-field-row">
                <label class="og-label">Object-group:</label>
                <input type="text" id="og-name" class="input-field og-input" placeholder="Название OG..." maxlength="100">
                <button onclick="clearOGField('og-name')" class="btn-del">del</button>
            </div>

            <!-- Строка: IP / Network -->
            <div class="og-field-row">
                <label class="og-label">IP / Network:</label>
                <input type="text" id="og-ip" class="input-field og-input" placeholder="any" maxlength="50">
                <button onclick="clearOGField('og-ip')" class="btn-del">del</button>
            </div>

            <!-- Кнопка Очистить всё -->
            <div class="og-field-row og-clear-all-row">
                <button onclick="clearAllOGFields()" class="btn-del-all">del all</button>
            </div>
        </div>

        <!-- Кнопка Поиск -->
        <div class="og-search-container">
            <button onclick="performOGSearch()" class="btn btn-search og-btn-search">🔎 Поиск</button>
        </div>
        <div class="og-search-container">
               <button onclick="downloadResult()" id="og-save-btn" class="og-btn-save">💾 </button>
        </div>

        <!-- Поле вывода результатов -->
        <div class="og-results-panel">
            <div id="og-results-content">
                <p class="placeholder-text">Результаты поиска появятся здесь...</p>
            </div>
        </div>
    </div>

    <!-- Подключаем логику, которая будет работать внутри этой вкладки -->
    <script src="/static/js/og_viewer.js"></script>
    <script>
        // Задаем минимально допустимые размеры окна (соответствующие стартовым)
        const MIN_WIDTH = 600;
        const MIN_HEIGHT = 680;

        window.addEventListener('resize', () => {
            // Проверяем текущие внешние размеры окна (включая рамки браузера)
            if (window.outerWidth < MIN_WIDTH || window.outerHeight < MIN_HEIGHT) {

                // Вычисляем новые размеры (не даем им упасть ниже лимита)
                const targetWidth = Math.max(window.outerWidth, MIN_WIDTH);
                const targetHeight = Math.max(window.outerHeight, MIN_HEIGHT);

                // Принудительно меняем размер окна обратно
                window.resizeTo(targetWidth, targetHeight);
            }
        });
    </script>
<script>
function downloadResult() {
    // 1. Получаем элемент ввода (замените 'og-input' на id вашего textarea или input!)
    const inputElement = document.getElementById('og-input') || document.querySelector('textarea');

    // 2. Получаем элемент вывода
    const preElement = document.getElementById('nb-search-pre');

    // Считываем значения (если элемент не найден, берем пустую строку)
    const inputText = inputElement ? inputElement.value.trim() : "";
    const outputText = preElement ? (preElement.innerText || preElement.textContent || "").trim() : "";

    // 3. Проверяем, есть ли хоть какие-то данные для сохранения
    if (!outputText) {
        setTimeout(() => {
            alert("Нет данных для сохранения!");
        }, 30);
        return;
    }

    // 4. Формируем красивый итоговый текст с префиксами
    let fileContent = "";

    if (inputText) {
        fileContent += `---NB Viewer---\nВвод:\n${inputText}\n\n`;
    }

    if (outputText) {
        fileContent += `Вывод:\n${outputText}\n`;
    }

    // 5. Создаем Blob и скачиваем файл
    try {
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;

        // Формируем имя файла с текущей датой и временем
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        a.download = `acl_search_result_${timestamp}.txt`;

        document.body.appendChild(a);
        a.click();

        // Очищаем ссылку из памяти
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);

    } catch (err) {
        console.error("Ошибка при скачивании файла:", err);
    }
}
</script>
</body>
</html>
