<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>    ACL Parser</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/og_viewer.css">

</head>
<body>

    <header>
        <h1>    🔍 ACL Parser v0.67</h1>
    </header>
    <div class="top-card">

        <!-- Помещаем контейнер кнопки ВНУТРЬ карточки -->
        <div class="help-container">
            <button onclick="openHelp()" class="btn-help" title="Справка">?</button>
        </div>

        <!-- ... ваши остальные элементы карточки (Source or Destination, Реверс IP и т.д.) ... -->

    </div>
    <div class="main-container">
        <div class="form-card">

            <!-- Source IP -->
            <div class="form-row">
                <label class="form-label">Source IP:</label>
                <input type="text"
                       id="source_ip"
                       placeholder="any"
                       class="input-field"
                       onfocus="this.placeholder=''"
                       onblur="if(this.value==='') this.placeholder='any'"
                       maxlength="50"
                >
            </div>

<!-- Destination IP -->
            <div class="form-row">
                <label class="form-label">Destination IP:</label>
                <input type="text"
                       id="dest_ip"
                       placeholder="any"
                       class="input-field"
                       onfocus="this.placeholder=''"
                       onblur="if(this.value==='') this.placeholder='any'"
                       maxlength="50">
            </div>

<!-- Чекбоксы + Кнопки в одну строку -->
            <div class="controls-row">
                <!-- Левая часть - чекбоксы -->
                <div class="checkboxes">
                    <label class="checkbox-label">
                        <input type="checkbox" id="strict_match">
                        Строгое соответствие
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="source_or_dest">
                        Source or Destination
                    </label>
                </div>
<!--                УЭС:  -->



                <!-- Правая часть - кнопки -->
                <div class="action-buttons">
                    <button onclick="resetIPs()" class="btn-secondary">Сброс IP</button>
                    <button onclick="reverseIPs()" class="btn-secondary">Реверс IP</button>
                </div>
            </div>

        </div>
            <div class="ues-row">
        <div class="option-title2">УЭС:</div>
            <div class="option-content2" id="ues-group" >
        <!--        <div class="filter-content" id="regions-group">-->
                <label class="checkbox-label2"><input type="checkbox" class="ues"> ЛВС</label>
                <label class="checkbox-label2"><input type="checkbox" class="ues"> ЦОД</label>
    </div>
        </div>

        <!-- Блок Фильтр по регионам -->
        <div class="filter-block-region">
            <div class="filter-title">Фильтр по регионам:</div>
            <div class="filter-content" id="regions-group">
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Волга</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> ДВ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> СЗ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Центр</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> КЦ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Урал</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Юг</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Сибирь</label>
<div class="all-checkbox">
        <label class="checkbox-item">
            <input type="checkbox" id="all-regions"> Все
        </label>

            </div>
        </div>
    </div>

                <div class="filter-block-vendor">
            <div class="filter-title-vendor">Фильтр по оборудованию:</div>
            <div class="filter-content-vendor" id="vendor-group">
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco ASA</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco Firepower</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco IOS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco IOS XE</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco NX-OS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> FortiOS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Huawei</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Eltex</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Eltex ESR</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> HP ProCurve/HPE</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Прочие устройства</label>
<div class="all-checkbox-vendor">
        <label class="checkbox-item-vendor">
            <input type="checkbox" id="all-vendors"> Все
        </label>

            </div>
        </div>


    </div>

</div>

        <div class="search-container">
            <!-- Кнопка Поиск (по центру) -->
            <button onclick="handleSearchClick()" id="search-btn" class="btn btn-search">🔎 Поиск</button>

        <div class="og-container">
        <button onclick="openOgViewer()" class="og-viewer">
                📦 OG Viewer
            </button>
        </div>
            <!-- кнопка netbox -->
        <div class="nb-container">
                <button onclick="openNbViewer()" class="nb-viewer">
                    📜 NB Viewer
                </button>
            </div>


            <!-- Кнопка Скачать (вырвем из потока и прижмем вправо) -->
            <div class="download-container">
                <button onclick="downloadResult()" id="save-btn" class="btn-download">
                    💾 Сохранить в файл
                </button>
            </div>



        </div>


<div class="results-panel">

        <div id="results-content" class="results-content">
        </div>
    </div>


    <!-- Ваша существующая форма -->

    <script src="/static/js/main.js" defer></script>
</body>
</html>
