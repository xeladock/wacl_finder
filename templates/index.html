<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>    ACL Parser</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1>    🔍 ACL Parser v0.14</h1>
    </header>

    <div class="main-container">
        <div class="form-card">

            <!-- Source IP -->
            <div class="form-row">
                <label class="form-label">Source IP:</label>
                <input type="text"
                       id="source_ip"
                       placeholder="any"
                       class="input-field"
                       onfocus="this.placeholder=''"
                       onblur="if(this.value==='') this.placeholder='any'">
            </div>

<!-- Destination IP -->
            <div class="form-row">
                <label class="form-label">Destination IP:</label>
                <input type="text"
                       id="dest_ip"
                       placeholder="any"
                       class="input-field"
                       onfocus="this.placeholder=''"
                       onblur="if(this.value==='') this.placeholder='any'">
            </div>

<!-- Чекбоксы + Кнопки в одну строку -->
            <div class="controls-row">
                <!-- Левая часть - чекбоксы -->
                <div class="checkboxes">
                    <label class="checkbox-label">
                        <input type="checkbox" id="strict_match">
                        Строгое соответствие
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="source_or_dest">
                        Source or Destination
                    </label>
                </div>
<!--                УЭС:  -->



                <!-- Правая часть - кнопки -->
                <div class="action-buttons">
                    <button onclick="resetIPs()" class="btn-secondary">Сброс IP</button>
                    <button onclick="reverseIPs()" class="btn-secondary">Реверс IP</button>
                </div>
            </div>

        </div>
            <div class="ues-row">
<div class="option-title2">УЭС:</div>
    <div class="option-content2" id="ues-group" >
<!--        <div class="filter-content" id="regions-group">-->
        <label class="checkbox-label2"><input type="checkbox" class="ues"> ЛВС</label>
        <label class="checkbox-label2"><input type="checkbox" class="ues"> ЦОД</label>
</div>
        </div>

        <!-- Блок Фильтр по регионам -->
        <div class="filter-block-region">
            <div class="filter-title">Фильтр по регионам:</div>
            <div class="filter-content" id="regions-group">
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Волга</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> ДВ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> СЗ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Центр</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> КЦ</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Урал</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Юг</label>
        <label class="checkbox-item"><input type="checkbox" class="region-cb"> Сибирь</label>
<div class="all-checkbox">
        <label class="checkbox-item">
            <input type="checkbox" id="all-regions"> Все
        </label>

            </div>
        </div>
    </div>

                <div class="filter-block-vendor">
            <div class="filter-title-vendor">Фильтр по оборудованию:</div>
            <div class="filter-content-vendor" id="vendor-group">
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco ASA</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco Firepower</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco IOS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco IOS XE</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Cisco NX-OS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> FortiOS</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Huawei</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Eltex</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Eltex ESR</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> HP ProCurve/HPE</label>
        <label class="checkbox-item-vendor"><input type="checkbox" class="vendor-cb"> Прочие устройства</label>
<div class="all-checkbox-vendor">
        <label class="checkbox-item-vendor">
            <input type="checkbox" id="all-vendors"> Все
        </label>

            </div>
        </div>

    </div>
</div>
        <div class="search-container">
                <button onclick="performSearch()" class="btn-search">
                    🔎 ПОИСК
                </button>
            </div>

<div class="results-panel">

        <div id="results-content" class="results-content">

        </div>
    </div>
    </div>


    <!-- Ваша существующая форма -->


    <script>
        function resetIPs() {
            const src = document.getElementById('source_ip');
            const dst = document.getElementById('dest_ip');

            src.value = '';
            dst.value = '';

            src.placeholder = 'any';
            dst.placeholder = 'any';
        }

        function reverseIPs() {
            const source = document.getElementById('source_ip');
            const dest = document.getElementById('dest_ip');
            const temp = source.value;
            source.value = dest.value;
            dest.value = temp;
        }



document.addEventListener('keydown', function(e) {
if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        resetIPs();
    }

    });

    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

        // Логика для регионов
        const allRegions = document.getElementById('all-regions');
        if (allRegions) {
            allRegions.addEventListener('change', function() {
                const isChecked = this.checked;
                const checkboxes = document.querySelectorAll('#regions-group .region-cb');
                checkboxes.forEach(cb => cb.checked = isChecked);
            });
        }

        // Логика для вендоров
        const allVendors = document.getElementById('all-vendors');
        if (allVendors) {
            allVendors.addEventListener('change', function() {
                const isChecked = this.checked;
                const checkboxes = document.querySelectorAll('#vendor-group .vendor-cb');
                checkboxes.forEach(cb => cb.checked = isChecked);
            });
        }
        });
    </script>

    <script>
async function performSearch() {
    console.log("performSearch вызвана!");
    const resultsDiv = document.getElementById('results-content');
    resultsDiv.innerHTML = '<p class="placeholder-text">Выполняется поиск...</p>';

    // Собираем чекбоксы
    const ues = [];
    document.querySelectorAll('#ues-group input[type="checkbox"]:checked').forEach(cb => {
        ues.push(cb.parentElement.textContent.trim());
    });

    const regions = [];
    document.querySelectorAll('#regions-group input[type="checkbox"]:checked').forEach(cb => {
        regions.push(cb.parentElement.textContent.trim());
    });

    const vendors = [];
    document.querySelectorAll('#vendor-group input[type="checkbox"]:checked').forEach(cb => {
        vendors.push(cb.parentElement.textContent.trim());
    });

    const data = {
        source_ip: document.getElementById('source_ip').value.trim() || 'any',
        dest_ip: document.getElementById('dest_ip').value.trim() || 'any',
        strict_mode: document.getElementById('strict_match').checked,
        sod: document.getElementById('source_or_dest').checked,
        ues: ues,
        regions: regions,
        vendors: vendors
    };

    console.log("Отправляемые данные:", data);   // для отладки

    try {
        const response = await fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

if (result.status === "success") {
    let html = `<pre id="search-pre" style="background:#f8f9fa; padding:1px; border-radius:8px; max-height:670px; overflow:auto;">`;
    html += result.results.join('\n');
    html += '</pre>';

    // Создаем наблюдатель за изменениями в DOM
    const observer = new MutationObserver((mutations, obs) => {
        const preElement = document.getElementById('search-pre');
        if (preElement) {
            // Как только элемент появился и наполнился текстом — скроллим
            preElement.scrollTop = preElement.scrollHeight;

            // Также плавно двигаем экран к низу этого блока, если он ушел за экран
            preElement.scrollIntoView({ behavior: 'smooth', block: 'end' });

            obs.disconnect(); // Выключаем наблюдатель, задача выполнена
        }
    });

    // Включаем слежку за блоком результатов перед тем, как вставить HTML
    observer.observe(resultsDiv, { childList: true, subtree: true });

    resultsDiv.innerHTML = html;

            // Дополнительная попытка
        } else {
            resultsDiv.innerHTML = `<p style="color:red">Ошибка: ${result.message}</p>`;
        }

    } catch (err) {
        resultsDiv.innerHTML = `<p style="color:red">Ошибка соединения: ${err.message}</p>`;
    }
}
    </script>



</body>
</html>
